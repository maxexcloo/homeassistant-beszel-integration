[tools]
# gh = "latest"
# python = "latest"
# ruff = "latest"

# Development
[tasks.check]
description = "Run All Local Checks"
run = """
ruff check .
ruff format --check .
python -m unittest discover -s tests
"""

[tasks.fmt]
description = "Format Python Files"
run = """
ruff check --fix --select I .
ruff format .
"""
