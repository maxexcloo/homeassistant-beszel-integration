# Development
[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:updates",
  "check:whitespace",
  "test:python",
]

[tasks.fmt]
depends = ["fmt:mise", "fmt:oxfmt", "fmt:python"]

# Match the Python version supported by Home Assistant's pinned test dependencies.
[tasks."test:python"]
run = "uv run --no-project --python 3.14 --with-requirements requirements-test.txt python -B -m pytest"
