[tools]
python = "3.15.0"
ruff = "0.17.0"

[tasks.check]
description = "Run All Local Checks"
run = """
ruff check .
ruff format --check .
python -m unittest discover -s tests
"""

[tasks.fmt]
description = "Format Python Files"
run = """
ruff check --fix --select I .
ruff format .
"""

[tasks.setup]
description = "Install Development Tools"
run = "mise install"
